[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "undertow"
version = "0.1.0"
description = "Rotating Apple Music discovery playlists built from the music you already play"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    # Supplies the one-time Safari sign-in and token storage (macOS Keychain).
    # Pinned: Undertow imports its auth module directly.
    "applemusic-mcp==0.22.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.scripts]
undertow = "undertow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["undertow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
